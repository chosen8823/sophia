[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akashic-native-internet"
version = "0.1.0"
description = "AI-native retrieval, provenance, and historical-web interface"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[project.optional-dependencies]
archive = [
  "warcio>=1.7.5",
]
data = [
  "duckdb>=1.1",
  "pyarrow>=17",
]
observability = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]
all = [
  "warcio>=1.7.5",
  "duckdb>=1.1",
  "pyarrow>=17",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["akashic*"]

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
